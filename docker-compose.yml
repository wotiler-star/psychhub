# 心理学聚合平台 · 容器编排（前后端分离 + 反向代理）
# 一键启动：docker compose up -d  → 访问 http://localhost
services:
  db:
    image: postgres:16-alpine
    container_name: psych-hub-db
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-psych}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psych_pass}
      POSTGRES_DB: ${POSTGRES_DB:-psychhub}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psych}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    memswap_limit: 1024m

  backend:
    build:
      context: ./backend
    container_name: psych-hub-backend
    restart: unless-stopped
    init: true
    # 给优雅关闭留出窗口（与 main.ts 中 SIGTERM 处理匹配）
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 生产模式：触发「Swagger 关闭 + 严格 CSP + HSTS」安全收敛
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-psych}:${POSTGRES_PASSWORD:-psych_pass}@db:5432/${POSTGRES_DB:-psychhub}?schema=public
      PORT: 3001
      # 生产必改：强随机 32+ 位（openssl rand -hex 32）
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # 生产必填：放行的前端源（逗号分隔），缺省仅放行本地预览域名
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3400}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 首次启动要跑 migrate deploy + seed，预留充足启动宽限
      start_period: 40s
    mem_limit: 512m
    memswap_limit: 1024m

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE: http://backend:3001
    container_name: psych-hub-web
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # 等后端真正健康再启动，避免冷启动阶段 SSR 请求 500
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE: http://backend:3001
      # standalone server 监听地址（0.0.0.0 以接收容器网络流量）
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    healthcheck:
      # 轻量存活探针（/healthz 不依赖 backend，只验证 web 进程存活）
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    memswap_limit: 1024m

  nginx:
    image: nginx:1.27-alpine
    container_name: psych-hub-nginx
    restart: unless-stopped
    init: true
    depends_on:
      - web
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # 改为探测 web 的轻量 /healthz，避免每次探活都触发完整 SSR
      test: ["CMD-SHELL", "wget -qO- http://web:3000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 128m
    memswap_limit: 256m

volumes:
  pgdata:
